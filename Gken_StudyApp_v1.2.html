<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G検定 学習アプリ（オフライン版）</title>
<style>
:root{
  --blue:#0b5ed7; --blue-d:#084298; --blue-l:#e7f0fd;
  --green:#0f8a5f; --green-l:#e6f5ef;
  --red:#c0392b; --red-l:#fdecea;
  --amber:#b7791f; --amber-l:#fdf6e3;
  --line:#dfe3e8; --txt:#1f2937; --sub:#6b7280; --bg:#f5f7fa;
  --radius:10px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans JP","BIZ UDPGothic","BIZ UDPゴシック",system-ui,sans-serif;
  background:var(--bg); color:var(--txt); line-height:1.7; font-size:15px;
}
header{background:#fff;border-bottom:3px solid var(--blue);position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.hd{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;color:var(--blue-d);display:flex;align-items:center;gap:8px}
.logo .mark{display:inline-flex;width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;align-items:center;justify-content:center;font-size:14px}
.hd .spacer{flex:1}
.hd .ver{font-size:11px;color:var(--sub)}
nav{background:#fff;border-bottom:1px solid var(--line)}
.nv{max-width:1080px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto}
.nv button{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap;font-family:inherit}
.nv button:hover{color:var(--blue);background:var(--blue-l)}
.nv button.on{color:var(--blue-d);border-bottom-color:var(--blue);font-weight:700}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:17px;color:var(--blue-d);display:flex;align-items:center;gap:8px}
.card h3{margin:16px 0 8px;font-size:15px;color:var(--txt);border-left:4px solid var(--green);padding-left:8px}
.muted{color:var(--sub);font-size:13px;margin:0 0 12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
button.btn,a.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none;font-weight:500}
button.btn:hover{background:var(--blue-d)}
button.btn.g{background:var(--green)} button.btn.g:hover{background:#0b6f4c}
button.btn.o{background:#fff;color:var(--blue);border:1px solid var(--blue)} button.btn.o:hover{background:var(--blue-l)}
button.btn.gray{background:#fff;color:var(--sub);border:1px solid var(--line)} button.btn.gray:hover{background:#f0f2f5}
button.btn.red{background:#fff;color:var(--red);border:1px solid #f0b6b0} button.btn.red:hover{background:var(--red-l)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.tile{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:#fff;cursor:pointer;transition:.15s;text-align:left}
.tile:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(11,94,215,.12);transform:translateY(-1px)}
.tile .ic{font-size:22px}
.tile .t{font-weight:700;margin:6px 0 2px;font-size:15px;color:var(--blue-d)}
.tile .d{font-size:12.5px;color:var(--sub);line-height:1.6}
.kpi{border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center;background:#fff}
.kpi .v{font-size:24px;font-weight:700;color:var(--blue-d)}
.kpi .l{font-size:12px;color:var(--sub)}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 4px;color:var(--txt)}
select,input[type=number],input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:#fff}
.sw{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px;cursor:pointer}
.sw input{width:16px;height:16px;accent-color:var(--blue)}
.bar{height:9px;background:#eef1f5;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
th{background:var(--blue-l);color:var(--blue-d);font-weight:700;white-space:nowrap}
tr:nth-child(even) td{background:#fbfcfe}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--blue-l);color:var(--blue-d);font-weight:700}
.tag.g{background:var(--green-l);color:var(--green)}
.tag.r{background:var(--red-l);color:var(--red)}
.tag.a{background:var(--amber-l);color:var(--amber)}
/* ---- exam ---- */
.exbar{position:sticky;top:52px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;box-shadow:var(--shadow)}
.exbar .qn{font-weight:700;color:var(--blue-d)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:4px 10px;border-radius:8px;background:var(--green-l);color:var(--green)}
.timer.warn{background:var(--red-l);color:var(--red)}
.qtext{font-size:16px;font-weight:700;margin:6px 0 14px;line-height:1.75}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:12px 14px;margin-bottom:9px;cursor:pointer;font-family:inherit;font-size:14.5px;line-height:1.6;transition:.12s}
.opt:hover{border-color:var(--blue);background:var(--blue-l)}
.opt.sel{border-color:var(--blue);background:var(--blue-l);font-weight:600}
.opt.ok{border-color:var(--green);background:var(--green-l)}
.opt.ng{border-color:var(--red);background:var(--red-l)}
.opt .k{display:inline-flex;width:22px;height:22px;border-radius:5px;background:#eef1f5;color:var(--sub);align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-right:8px}
.opt.sel .k,.opt.ok .k{background:var(--blue);color:#fff}
.opt.ok .k{background:var(--green)} .opt.ng .k{background:var(--red)}
.expl{border-left:4px solid var(--green);background:var(--green-l);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px;margin-top:10px}
.expl.ng{border-left-color:var(--red);background:var(--red-l)}
.expl b{display:block;margin-bottom:4px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;max-height:190px;overflow:auto}
.navgrid button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 0;font-size:12px;cursor:pointer;font-family:inherit}
.navgrid button.ans{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d);font-weight:700}
.navgrid button.flag{background:var(--amber-l);border-color:#e0c068}
.navgrid button.cur{outline:2px solid var(--blue);outline-offset:1px}
.navgrid button.ok{background:var(--green-l);border-color:var(--green)}
.navgrid button.ng{background:var(--red-l);border-color:var(--red)}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.foot .spacer{flex:1}
.score{text-align:center;padding:10px 0}
.score .big{font-size:46px;font-weight:700;line-height:1.1}
.score .big.pass{color:var(--green)} .score .big.fail{color:var(--amber)}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
details.rv{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
details.rv>summary{padding:10px 12px;cursor:pointer;font-size:14px;list-style:none;display:flex;gap:8px;align-items:flex-start}
details.rv>summary::-webkit-details-marker{display:none}
details.rv .body{padding:0 12px 12px}
.notice{background:var(--amber-l);border:1px solid #efd9a0;border-radius:8px;padding:10px 12px;font-size:13px;color:#7a5b12;margin-bottom:14px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11.5px;background:#fbfcfe;color:var(--sub)}
.hide{display:none!important}
/* ---- v1.2 追加 ---- */
.pgwrap{flex-basis:100%;display:flex;align-items:center;gap:10px}
.pgwrap .bar{flex:1}
.pgtxt{font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:#fbfcfe;color:var(--sub);font-weight:700}
.chip.g{border-color:var(--green);background:var(--green-l);color:var(--green)}
.chip.a{border-color:#e0c068;background:var(--amber-l);color:var(--amber)}
.daybars{display:flex;align-items:flex-end;gap:6px;height:120px;border-bottom:1px solid var(--line);padding-bottom:4px}
.daybars>div{flex:1;text-align:center}
.daybars .bx{background:var(--blue);border-radius:4px 4px 0 0;min-height:3px}
.daybars .bx.ok{background:var(--green)}
.daybars .lb{font-size:10px;color:var(--sub);margin-top:3px;white-space:nowrap}
@media(max-width:640px){.hd .ver{display:none}.exbar{top:48px}main{padding:12px}}
@media print{header,nav,.foot,.noprint{display:none}}
</style>
</head>
<body>
<header><div class="hd">
  <div class="logo"><span class="mark">G</span>G検定 学習アプリ</div>
  <div class="spacer"></div>
  <span class="ver" id="hdInfo"></span>
</div></header>
<nav><div class="nv" id="nav"></div></nav>
<main id="app"></main>

<script>
/* ===== 問題バンク（オリジナル作成／JDLA公式の過去問ではありません） ===== */
const QUESTIONS = [
/* --- 1. 人工知能とは --- */
{c:"人工知能とは",q:"「AI効果」の説明として最も適切なものはどれか。",o:["AIの性能が指数関数的に向上する現象","AIの原理が分かると、それは知能ではないと見なされる心理的な現象","AI導入で業務効率が急上昇する経営効果","AI同士が競合して精度が上がる現象"],a:1,e:"AI効果とは、仕組みが解明されると「それは単なる自動処理で知能ではない」と考えてしまう人間側の心理的傾向のこと。"},
{c:"人工知能とは",q:"人工知能のレベル分けのうち「レベル2：古典的な人工知能」に該当するものはどれか。",o:["温度で自動オンオフするエアコンの制御","多数のルールを組み合わせて診断を行う推論システム","データから自動で分類ルールを学習する仕組み","多層ニューラルネットワークによる特徴量の自動獲得"],a:1,e:"レベル1は単純な制御、レベル2は探索・推論や知識ベースによる古典的AI、レベル3は機械学習、レベル4は深層学習。"},
{c:"人工知能とは",q:"チューリングテストの説明として正しいものはどれか。",o:["機械が自意識を持つかを脳波で測る試験","判定者が対話相手を人間と区別できなければ知能があるとみなす試験","AIの計算速度を評価するベンチマーク","AIの学習データの偏りを検査する手法"],a:1,e:"チューリングテストは「人間と区別がつかない受け答えができるか」で知能を判定する思考実験的なテスト。ローブナーコンテストはその実施例。"},
{c:"人工知能とは",q:"「中国語の部屋」が問題提起している内容として最も適切なものはどれか。",o:["記号処理ができても意味を理解しているとは限らない","計算資源が不足すると推論が破綻する","多言語対応には大規模コーパスが必要である","翻訳精度は文法規則で決まる"],a:0,e:"サール(Searle)の思考実験。強いAIへの批判であり、シンボルグラウンディング問題とも関連が深い。"},
{c:"人工知能とは",q:"フレーム問題の説明として最も適切なものはどれか。",o:["画像のフレーム単位で処理が重くなる問題","有限の情報処理能力では、今しようとしている事に関係する事柄だけを選び出せない問題","学習データの枠外の値を予測できない問題","ニューラルネットの層が深すぎて勾配が消える問題"],a:1,e:"フレーム問題は、現実世界の無限の事象から関係するものだけを切り出せないという人工知能の根本的な難問。"},
{c:"人工知能とは",q:"シンボルグラウンディング問題の説明として正しいものはどれか。",o:["記号と、それが指す実世界の意味を結びつけられない問題","記号処理の計算量が爆発する問題","学習率が大きすぎて発散する問題","知識をルールとして書き出す手間が膨大になる問題"],a:0,e:"「シマウマ」という記号と実物の縞模様の馬を結びつけられない、という問題。最後の選択肢は知識獲得のボトルネックの説明。"},
{c:"人工知能とは",q:"「知識獲得のボトルネック」が指すものはどれか。",o:["GPUメモリの制約","人間の専門知識をシステムに書き出して入力する作業の膨大さ","学習データのラベル付けコストが不要になること","推論速度の上限"],a:1,e:"エキスパートシステムで顕在化した課題。専門家の暗黙知を明示的ルールにする作業が非常に困難だった。"},
{c:"人工知能とは",q:"シンギュラリティ（技術的特異点）の一般的な説明はどれか。",o:["AIが人間の知能を超え、以降の変化が予測困難になるとされる時点","AIモデルの損失関数が発散する点","GPUの性能が頭打ちになる点","学習曲線が停滞する点"],a:0,e:"レイ・カーツワイルらが提唱。技術進歩が自己加速し、人間が予測できなくなる転換点とされる。"},
{c:"人工知能とは",q:"ダートマス会議に関する記述として正しいものはどれか。",o:["1956年に開催され、「人工知能(Artificial Intelligence)」という言葉が使われた","2012年にディープラーニングの有効性が示された画像認識コンペである","日本で開催されたAI倫理に関する国際会議である","チューリングが単独で発表した論文の名称である"],a:0,e:"ジョン・マッカーシーが提唱し、AIという用語が公式に使われた会議として知られる。"},
{c:"人工知能とは",q:"トイ・プロブレムの説明として最も適切なものはどれか。",o:["子供向け教育用AIのこと","ルールが明確に定義された簡単な問題で、現実の複雑な問題には適用しにくいもの","学習データが少なすぎる問題","報酬設計を誤った強化学習の問題"],a:1,e:"迷路やパズルなど、探索で解けるが現実問題に直結しにくい問題。第一次AIブーム失速の要因の一つ。"},
{c:"人工知能とは",q:"「強いAI」と「弱いAI」の区別として適切なものはどれか。",o:["強いAIは大規模、弱いAIは小規模なモデルを指す","強いAIは意識や自己を持ちうるAI、弱いAIは特定タスクを処理する道具としてのAI","強いAIは教師あり学習、弱いAIは教師なし学習を指す","強いAIはGPU、弱いAIはCPUで動く"],a:1,e:"サールによる区分。現在実用化されているものは基本的に弱いAI（特化型AI）に該当する。"},
{c:"人工知能とは",q:"エージェントの説明として最も適切なものはどれか。",o:["学習データを保管するデータベース","環境を知覚し、目標達成のために自律的に行動する主体","ニューラルネットワークの出力層","ラベル付け作業を行う人間の作業者"],a:1,e:"知覚（センサ）と行動（アクチュエータ）を持ち、環境とやり取りする主体。強化学習の枠組みでも中心概念。"},

/* --- 2. 人工知能をめぐる動向 --- */
{c:"人工知能をめぐる動向",q:"幅優先探索の特徴として正しいものはどれか。",o:["最短経路が保証されやすいが、メモリ消費が大きい","メモリ消費は少ないが最短解の保証がない","常に最適解を定数時間で求められる","乱数を使って解を近似する"],a:0,e:"幅優先探索は浅い層から順に全探索するため最短解を見つけやすいが、保持ノードが多くメモリを消費する。深さ優先はその逆。"},
{c:"人工知能をめぐる動向",q:"αβ法の目的として最も適切なものはどれか。",o:["Mini-Max法の探索で無駄な枝を刈り込み計算量を削減する","報酬を割引いて将来価値を評価する","勾配消失を防ぐ","過学習を抑制する"],a:0,e:"αカットとβカットにより、結果に影響しない枝の展開を省略する枝刈り手法。"},
{c:"人工知能をめぐる動向",q:"モンテカルロ法（ゲーム木探索での利用）の説明として適切なものはどれか。",o:["盤面を数式で厳密に評価する","ランダムなプレイアウトを多数試行し、勝率で手を評価する","過去の棋譜を丸暗記して再生する","盤面を全探索して最善手を決定する"],a:1,e:"終局までランダムに打ち切り、統計的に手の良さを推定する。囲碁AIの発展に大きく寄与した。"},
{c:"人工知能をめぐる動向",q:"MYCIN（マイシン）の説明として正しいものはどれか。",o:["感染症診断を行うエキスパートシステム","有機化合物の構造推定システム","自然言語対話プログラム","クイズ番組で勝利したQAシステム"],a:0,e:"DENDRALは有機化合物の構造推定、ELIZAは対話プログラム、ワトソンはQAシステム。"},
{c:"人工知能をめぐる動向",q:"オントロジーに関する説明として最も適切なものはどれか。",o:["概念や関係を体系的に記述し、知識を共有可能にするための枠組み","画像の特徴量を抽出する手法","強化学習の方策を表す関数","データベースの物理設計手法"],a:0,e:"is-a、has-a、part-ofなどの関係を明示し、知識の意味を計算機が扱えるようにする。セマンティックWebの基盤。"},
{c:"人工知能をめぐる動向",q:"「次元の呪い」の説明として正しいものはどれか。",o:["次元が増えるほどデータが疎になり、学習に必要なデータ量が爆発的に増える","次元が増えるほど計算が高速になる","次元削減すると必ず精度が向上する","入力次元が2以下だと学習できない"],a:0,e:"高次元空間では点同士の距離が均質化し、汎化に必要なサンプル数が指数的に増加する。"},
{c:"人工知能をめぐる動向",q:"ILSVRC2012でAlexNetが達成したこととして正しいものはどれか。",o:["従来手法を大差で上回り、ディープラーニングの有効性を示した","初めて人間の精度を超えた音声認識を実現した","囲碁のトップ棋士に勝利した","自然言語処理でTransformerを導入した"],a:0,e:"トロント大学ヒントンらのAlexNetが圧勝し、第三次AIブームの決定打となった。"},
{c:"人工知能をめぐる動向",q:"ネオコグニトロンに関する説明として適切なものはどれか。",o:["福島邦彦が提案した、CNNの原型とされる視覚モデル","強化学習の代表的アルゴリズム","初の商用エキスパートシステム","自然言語の分散表現手法"],a:0,e:"S細胞・C細胞の階層構造を持ち、現在の畳み込み層・プーリング層に相当する考え方の先駆け。"},
{c:"人工知能をめぐる動向",q:"アルファ碁(AlphaGo)に関する説明として適切なものはどれか。",o:["ディープラーニングと強化学習・モンテカルロ木探索を組み合わせ、プロ棋士に勝利した","ルールベースの探索のみでプロ棋士に勝利した","自然言語処理専用のモデルである","画像生成に用いられるGANの一種である"],a:0,e:"方策ネットワークと価値ネットワーク、モンテカルロ木探索の組み合わせが特徴。"},

{c:"人工知能をめぐる動向",q:"エキスパートシステムの限界として指摘された点はどれか。",o:["知識の記述・保守コストが高く、例外処理に弱い","計算資源が余りすぎる","学習データが不要で汎化しすぎる","確率的推論が一切できない"],a:0,e:"知識獲得のボトルネックや、ルール数増加に伴う保守困難性が第二次AIブーム終息の一因。"},

{c:"機械学習の概要",q:"ロジスティック回帰の説明として正しいものはどれか。",o:["シグモイド関数を用いて確率を出力する分類の手法","連続値を直接出力する回帰専用の手法","クラスタ数を自動決定する教師なし手法","報酬を最大化する強化学習手法"],a:0,e:"名前は回帰だが分類に用いる。多クラスではソフトマックス関数を用いる。"},
{c:"機械学習の概要",q:"サポートベクターマシン(SVM)の基本的な考え方はどれか。",o:["マージンを最大化する境界を引く","誤差逆伝播で重みを更新する","データを木構造で分割する","報酬の期待値を最大化する"],a:0,e:"マージン最大化が原理。非線形分離にはカーネルトリックを用いる。"},
{c:"機械学習の概要",q:"カーネルトリックの利点として適切なものはどれか。",o:["高次元への写像を明示的に計算せず内積計算だけで非線形分離を実現する","学習データを削減できる","必ず線形分離可能になる","勾配計算が不要になる"],a:0,e:"写像後の内積をカーネル関数で置き換えることで、計算量を抑えつつ非線形性を扱える。"},
{c:"機械学習の概要",q:"ランダムフォレストの説明として正しいものはどれか。",o:["ブートストラップサンプリングと特徴量のランダム選択で多数の決定木を作り多数決する","一本の深い決定木を剪定して使う","誤りを逐次的に重み付けして直列に学習する","クラスタリングにより木構造を作る"],a:0,e:"バギング系のアンサンブル学習。直列に学習して誤りを補正するのはブースティング。"},
{c:"機械学習の概要",q:"バギングとブースティングの違いとして正しいものはどれか。",o:["バギングは並列に学習し分散を下げ、ブースティングは逐次学習しバイアスを下げやすい","バギングは逐次、ブースティングは並列に学習する","両者とも教師なし学習である","両者とも単一モデルの手法である"],a:0,e:"勾配ブースティングはブースティングの代表例で、残差を順次学習する。"},
{c:"機械学習の概要",q:"k-means法の説明として正しいものはどれか。",o:["クラスタ数kを事前に与え、重心の更新と割り当てを繰り返す非階層クラスタリング","樹形図を作る階層的クラスタリング","教師ラベルを用いて境界を学習する","主成分を抽出して次元削減する"],a:0,e:"ウォード法は階層的クラスタリングでデンドログラムを描く。PCAは次元削減。"},
{c:"機械学習の概要",q:"主成分分析(PCA)の目的として適切なものはどれか。",o:["分散が最大になる軸を見つけ、情報損失を抑えて次元削減する","クラス境界を最大化する","欠損値を補完する","時系列の周期性を検出する"],a:0,e:"寄与率で情報量を評価する。可視化にはt-SNEやMDSも用いられる。"},
{c:"機械学習の概要",q:"協調フィルタリングの課題である「コールドスタート問題」とは何か。",o:["新規ユーザーや新規アイテムは履歴がなく推薦精度が出ない問題","計算開始時にメモリが不足する問題","学習率が小さすぎて収束しない問題","古いデータが多すぎて偏る問題"],a:0,e:"対策としてコンテンツベースフィルタリングとの併用（ハイブリッド）が行われる。"},
{c:"機械学習の概要",q:"強化学習における「ε-greedy方策」の説明として正しいものはどれか。",o:["確率εでランダムに探索し、それ以外は価値最大の行動を選ぶ","常に価値最大の行動のみ選ぶ","常にランダムに行動する","報酬を割り引かずに合計する"],a:0,e:"探索と活用のトレードオフに対する代表的な対処法。UCB方策も同様の目的を持つ。"},
{c:"機械学習の概要",q:"Q学習の特徴として正しいものはどれか。",o:["行動価値関数Qを更新する、方策オフ型(off-policy)の手法","方策を直接パラメータ化して勾配で更新する","方策オン型でSARSAと同一の更新式である","教師ラベルを用いた分類手法である"],a:0,e:"SARSAは方策オン型。方策を直接更新するのは方策勾配法（REINFORCE等）。"},
{c:"機械学習の概要",q:"適合率(Precision)の定義として正しいものはどれか。",o:["陽性と予測したもののうち実際に陽性だった割合","実際に陽性のもののうち陽性と予測できた割合","全予測のうち正解した割合","偽陽性と偽陰性の合計"],a:0,e:"再現率(Recall)は実際の陽性のうち検出できた割合。両者の調和平均がF値。"},
{c:"機械学習の概要",q:"k-分割交差検証の説明として正しいものはどれか。",o:["データをk個に分割し、各回で1つを検証、残りを学習に使うことをk回繰り返す","データをk倍に水増しする","k個のモデルを多数決させる","学習率をk回変更する"],a:0,e:"ホールドアウト検証よりデータを有効活用でき、評価のばらつきを抑えられる。"},
{c:"機械学習の概要",q:"過学習が起きているときの典型的な兆候はどれか。",o:["訓練誤差は小さいが汎化（検証）誤差が大きい","訓練誤差も検証誤差も大きい","訓練誤差も検証誤差も同程度に小さい","学習が全く進まない"],a:0,e:"両方大きい場合は未学習（アンダーフィッティング）。対策は正則化、データ拡張、早期終了など。"},
{c:"機械学習の概要",q:"ROC曲線とAUCの説明として適切なものはどれか。",o:["真陽性率と偽陽性率の関係を描き、その下側面積で分類性能を評価する","学習曲線の下側面積で収束を評価する","損失の推移を可視化したもの","クラスタ数を決定する指標"],a:0,e:"AUCは1に近いほど良い。閾値に依存しない評価ができる点が利点。"},
{c:"機械学習の概要",q:"オッカムの剃刀が示す指針として適切なものはどれか。",o:["同程度に説明できるなら、より単純なモデルを選ぶべきである","常に複雑なモデルを選ぶべきである","データ量が増えたら層を増やすべきである","特徴量は多いほど良い"],a:0,e:"AICやBICといった情報量規準も、当てはまりとモデルの複雑さのバランスを取る考え方。"},

{c:"ディープラーニングの概要",q:"単純パーセプトロンの限界として正しいものはどれか。",o:["線形分離可能な問題しか解けず、XORが解けない","学習に必ずGPUが必要である","出力が常に確率になる","層を増やすと精度が下がる"],a:0,e:"多層パーセプトロン＋非線形活性化関数＋誤差逆伝播法により非線形分離が可能になった。"},
{c:"ディープラーニングの概要",q:"GPUがディープラーニングに適している主な理由はどれか。",o:["行列演算などの並列計算を大量のコアで高速に処理できるため","分岐処理がCPUより速いため","メモリ容量が無制限であるため","浮動小数点演算ができないため"],a:0,e:"TPUはディープラーニング向けにGoogleが開発した専用アクセラレータ。"},
{c:"ディープラーニングの概要",q:"ReLU関数の特徴として正しいものはどれか。",o:["正の領域で勾配が1となり、勾配消失を緩和できる","出力が常に0〜1に収まる","出力が-1〜1に収まる","出力の総和が1になる"],a:0,e:"出力0〜1はシグモイド、-1〜1はtanh、総和1はソフトマックス。負側の死活問題に対してはLeaky ReLUがある。"},
{c:"ディープラーニングの概要",q:"多クラス分類の出力層で一般的に用いられる活性化関数はどれか。",o:["ソフトマックス関数","ReLU関数","tanh関数","恒等関数"],a:0,e:"出力の総和が1となり各クラスの確率として解釈できる。誤差関数は交差エントロピーを組み合わせるのが一般的。"},
{c:"ディープラーニングの概要",q:"回帰問題で一般的に用いられる誤差関数はどれか。",o:["平均二乗誤差関数","交差エントロピー","ヒンジ損失","対数尤度比"],a:0,e:"分類では交差エントロピーが一般的。距離学習ではContrastive LossやTriplet Lossが使われる。"},
{c:"ディープラーニングの概要",q:"ドロップアウトの目的として正しいものはどれか。",o:["学習時にランダムにノードを無効化し、過学習を抑制する","勾配を強制的に大きくする","入力データを正規化する","層数を自動決定する"],a:0,e:"アンサンブル学習に近い効果を持つ正則化手法。推論時は全ノードを使う。"},
{c:"ディープラーニングの概要",q:"L1正則化の特徴として正しいものはどれか。",o:["パラメータがゼロになりやすく、特徴選択の効果がある","パラメータを一様に小さくするが、ゼロにはなりにくい","学習率を自動調整する","バッチサイズを制御する"],a:0,e:"L1はラッソ回帰、L2はリッジ回帰に対応する。"},
{c:"ディープラーニングの概要",q:"誤差逆伝播法の数学的基礎となる考え方はどれか。",o:["連鎖律（合成関数の微分）","ベイズの定理","中心極限定理","大数の法則"],a:0,e:"出力層から入力層へ勾配を伝播させる際、連鎖律で各層の偏微分を計算する。"},
{c:"ディープラーニングの概要",q:"勾配消失問題の説明として正しいものはどれか。",o:["層を遡るほど勾配が小さくなり、入力層側の重みが更新されにくくなる","勾配が発散して学習が破綻する","学習率が自動的に0になる","バッチサイズが小さくなる"],a:0,e:"シグモイド関数の微分の最大値が0.25であることが一因。ReLUやスキップ結合、LSTMのゲート機構が対策となる。"},
{c:"ディープラーニングの概要",q:"確率的勾配降下法(SGD)とバッチ学習の違いとして正しいものはどれか。",o:["SGDは一部のデータで都度更新するため局所最適解に陥りにくい面がある","SGDは全データで1回だけ更新する","バッチ学習はデータを1件ずつ使う","両者は完全に同一である"],a:0,e:"実務では中間のミニバッチ学習が一般的。1エポックは全データを1巡すること。"},
{c:"ディープラーニングの概要",q:"Adamの説明として最も適切なものはどれか。",o:["モーメンタムとRMSpropの考え方を組み合わせた最適化手法","正則化の一種","活性化関数の一種","データ拡張手法の一種"],a:0,e:"勾配の一次モーメントと二次モーメントを利用し、パラメータごとに学習率を調整する。"},
{c:"ディープラーニングの概要",q:"早期終了(early stopping)の目的として適切なものはどれか。",o:["検証誤差が悪化し始めた時点で学習を止め、過学習を防ぐ","学習率を毎エポック下げる","バッチサイズを増やす","勾配爆発を検出する"],a:0,e:"汎化性能の観点で最良の重みを保持する実務的な正則化手法。"},
{c:"ディープラーニングの概要",q:"ハイパーパラメータ探索の手法として挙げられるものはどれか。",o:["グリッドサーチ、ランダムサーチ","誤差逆伝播法、連鎖律","ドロップアウト、バッチ正規化","プーリング、パディング"],a:0,e:"学習率、層数、バッチサイズなど学習で自動決定されない値を外側の探索で決める。"},
{c:"ディープラーニングの概要",q:"鞍点(saddle point)の説明として正しいものはどれか。",o:["ある方向では極小、別方向では極大となる勾配がほぼ0の点","必ず大域最適解となる点","損失が無限大となる点","学習率が0になる点"],a:0,e:"高次元では局所最適解より鞍点が学習停滞の主因になりやすい。モーメンタム等が脱出に寄与する。"},

/* --- 5. ディープラーニングの要素技術 --- */
{c:"ディープラーニングの要素技術",q:"畳み込み層が全結合層に比べて有利な理由として適切なものはどれか。",o:["局所的な特徴を重み共有で抽出でき、パラメータ数を大幅に削減できる","必ず層を深くできるため","出力が確率になるため","学習率が不要になるため"],a:0,e:"位置に依存しない特徴抽出（並進不変性に寄与）とパラメータ効率が利点。"},
{c:"ディープラーニングの要素技術",q:"パディングを行う主な目的はどれか。",o:["畳み込み後の特徴マップサイズの縮小を防ぎ、端の情報も活用する","チャネル数を増やす","学習率を下げる","過学習を防ぐ"],a:0,e:"ストライドは移動幅で、大きくすると出力サイズが小さくなる。"},
{c:"ディープラーニングの要素技術",q:"最大値プーリングの効果として適切なものはどれか。",o:["微小な位置変化に対する頑健性（不変性）を高め、特徴マップを縮小する","パラメータを追加して表現力を高める","勾配を増幅する","入力を正規化する"],a:0,e:"グローバルアベレージプーリング(GAP)は特徴マップ全体を平均し、全結合層の代替として使われる。"},
{c:"ディープラーニングの要素技術",q:"バッチ正規化の説明として正しいものはどれか。",o:["ミニバッチ単位で分布を正規化し、学習の安定化・高速化を図る","バッチサイズを自動調整する","重みをゼロに初期化する","入力画像を回転させる"],a:0,e:"バッチサイズ依存を避けたい場合はレイヤー正規化やグループ正規化が用いられる。"},
{c:"ディープラーニングの要素技術",q:"スキップ結合(ResNet)の効果として正しいものはどれか。",o:["入力を後段へ迂回させ、勾配が伝わりやすくなり非常に深い層の学習が可能になる","パラメータ数をゼロにする","出力を確率に変換する","時系列を扱えるようにする"],a:0,e:"残差（差分）を学習する形になるため、層を深くしても劣化しにくい。"},
{c:"ディープラーニングの要素技術",q:"RNNが抱える課題と、その対策の組み合わせとして正しいものはどれか。",o:["長期依存の学習困難 ― LSTMやGRUのゲート機構","過学習 ― ストライドの増加","計算量過大 ― 交差エントロピー","勾配消失 ― パディング"],a:0,e:"LSTMはCEC（記憶セル）と入力・出力・忘却ゲートを持ち、長期依存を保持しやすい。"},
{c:"ディープラーニングの要素技術",q:"BPTTの説明として正しいものはどれか。",o:["RNNを時間方向に展開して誤差逆伝播を行う手法","バッチを並列処理する手法","事前学習済みモデルを転用する手法","時系列を周波数変換する手法"],a:0,e:"Back Propagation Through Time。系列が長いと勾配消失・爆発が起きやすい。"},
{c:"ディープラーニングの要素技術",q:"双方向RNNが有効な場面として適切なものはどれか。",o:["文全体が既知で、前後両方の文脈を使いたいタスク","リアルタイムに未来が未知の逐次予測","画像の物体検出","強化学習の方策更新"],a:0,e:"前向き・後ろ向き両方の隠れ状態を使うため、オンラインの逐次予測には使いにくい。"},
{c:"ディープラーニングの要素技術",q:"Self-Attentionの説明として最も適切なものはどれか。",o:["同一系列内の要素同士の関連度を計算して重み付けする","入力と出力の系列間のみで関連度を計算する","畳み込みで局所特徴を抽出する","プーリングで次元を削減する"],a:0,e:"入力と出力の間で計算するのはSource-Target Attention。TransformerはMulti-Head Attentionを用いる。"},
{c:"ディープラーニングの要素技術",q:"Transformerで位置エンコーディングが必要な理由はどれか。",o:["Attentionだけでは語順の情報が失われるため","勾配爆発を防ぐため","パラメータ数を減らすため","過学習を防ぐため"],a:0,e:"再帰も畳み込みも使わないため、位置情報を明示的に埋め込む必要がある。"},
{c:"ディープラーニングの要素技術",q:"オートエンコーダの基本構造として正しいものはどれか。",o:["入力を低次元に圧縮するエンコーダと、復元するデコーダから成る","分類器と回帰器から成る","生成器と識別器が競合する","方策と価値関数から成る"],a:0,e:"生成器と識別器が競合するのはGAN。VAEは潜在変数を確率分布として扱う派生形。"},
{c:"ディープラーニングの要素技術",q:"データ拡張(Data Augmentation)の目的として正しいものはどれか。",o:["データの多様性を人工的に増やし、汎化性能を高める","学習時間を短縮する","ラベルを自動生成して教師なし化する","モデルを軽量化する"],a:0,e:"Random Flip、Crop、Rotate、Cutout、Mixup、CutMixなどが代表例。"},
{c:"ディープラーニングの要素技術",q:"Mixupの説明として適切なものはどれか。",o:["2枚の画像とラベルを線形補間して新しい学習データを作る","画像の一部を矩形で欠損させる","画像の明るさを変える","画像を左右反転させる"],a:0,e:"矩形欠損はCutout／Random Erasing、貼り合わせはCutMix。"},
{c:"ディープラーニングの要素技術",q:"Depthwise Separable Convolutionの利点として正しいものはどれか。",o:["畳み込みを空間方向とチャネル方向に分解し、計算量とパラメータを削減する","受容野を無限に広げる","勾配消失を完全に防ぐ","ラベルが不要になる"],a:0,e:"MobileNetなどの軽量モデルで採用される。受容野拡大にはDilated(Atrous) Convolutionが使われる。"},

{c:"ディープラーニングの応用例",q:"YOLOやSSDが分類される画像認識タスクはどれか。",o:["物体検出","セマンティックセグメンテーション","姿勢推定","画像生成"],a:0,e:"1段階(one-stage)検出器として高速。Faster R-CNNは2段階検出器。"},
{c:"ディープラーニングの応用例",q:"Open Poseが対象とするタスクはどれか。",o:["姿勢推定","文書要約","音声合成","異常検知"],a:0,e:"人体の関節点（キーポイント）を推定する。"},
{c:"ディープラーニングの応用例",q:"word2vecの説明として正しいものはどれか。",o:["単語を意味的な関係を反映した低次元ベクトル（分散表現）に変換する","単語を出現頻度のワンホットベクトルに変換する","文章を要約する","音声を文字に変換する"],a:0,e:"CBOWは周辺語から中心語、スキップグラムは中心語から周辺語を予測する。"},
{c:"ディープラーニングの応用例",q:"TF-IDFの説明として正しいものはどれか。",o:["文書内での出現頻度と、全文書での希少性を掛け合わせて単語の重要度を測る","単語を512次元に埋め込む手法","文の構文木を作る手法","音素を推定する手法"],a:0,e:"多くの文書に現れる一般語の重みを下げ、特徴的な語を重視する。"},
{c:"ディープラーニングの応用例",q:"BERTの特徴として正しいものはどれか。",o:["双方向の文脈を考慮した事前学習を行い、各種タスクへファインチューニングできる","一方向のみの文脈で生成に特化している","画像分類専用モデルである","強化学習のアルゴリズムである"],a:0,e:"マスクした単語の予測などで事前学習し、下流タスクに転用する。"},
{c:"ディープラーニングの応用例",q:"メル周波数ケプストラム係数(MFCC)が用いられる分野はどれか。",o:["音声処理における特徴量抽出","画像のセグメンテーション","文書分類のみ","強化学習の報酬設計"],a:0,e:"人間の聴覚特性（メル尺度）に基づき、スペクトル包絡の情報を圧縮した特徴量。"},
{c:"ディープラーニングの応用例",q:"DQNの特徴として正しいものはどれか。",o:["Q学習にディープラーニングを組み合わせ、経験再生や固定した目標ネットワークで安定化した","方策を直接勾配で更新する手法である","教師あり学習で画像を分類する","文章を生成する"],a:0,e:"ダブルDQN、デュエリングネットワーク、Rainbowなどの改良版がある。"},
{c:"ディープラーニングの応用例",q:"GAN（敵対的生成ネットワーク）の仕組みとして正しいものはどれか。",o:["生成器と識別器を競わせて、本物らしいデータの生成を学習する","入力を圧縮して復元する","時系列を再帰的に処理する","報酬を最大化する方策を学習する"],a:0,e:"CycleGANは対応のない画像間のドメイン変換、Pix2Pixは対応ありの画像変換。"},
{c:"ディープラーニングの応用例",q:"Diffusion Modelの基本的な考え方として適切なものはどれか。",o:["データにノイズを段階的に加える過程を逆にたどり、ノイズから生成する","識別器を騙すように生成器を学習する","潜在変数を正規分布に近づけて再構成する","勾配を反転させて敵対的例を作る"],a:0,e:"近年の高品質画像生成の主流。GANやVAEとは異なる生成アプローチ。"},

{c:"ディープラーニングの応用例",q:"CLIPの特徴として正しいものはどれか。",o:["画像とテキストを同じ埋め込み空間で対応付け、Zero-shot分類などが可能","音声を文字起こしする","強化学習の方策を学習する","時系列の異常検知を行う"],a:0,e:"マルチモーダルの代表例。DALL-EはText-To-Imageの生成モデル。"},
{c:"ディープラーニングの応用例",q:"Grad-CAMの目的として正しいものはどれか。",o:["CNNが判断根拠とした画像領域をヒートマップで可視化する","モデルを軽量化する","学習データを増やす","勾配爆発を防ぐ"],a:0,e:"XAI（説明可能AI）の代表手法。LIMEやSHAPは局所的な説明に用いられる。"},
{c:"ディープラーニングの応用例",q:"モデルの軽量化手法である「蒸留(distillation)」の説明はどれか。",o:["大きな教師モデルの出力を用いて小さな生徒モデルを学習させる","重みを低ビットで表現する","重要でない重みを削除する","層を追加して表現力を高める"],a:0,e:"低ビット化は量子化、重み削除はプルーニング。宝くじ仮説はプルーニング関連の仮説。"},
{c:"ディープラーニングの応用例",q:"エッジAIを採用する主な利点として適切なものはどれか。",o:["通信遅延の低減とプライバシー保護、通信量削減","無制限の計算資源が使える","モデルサイズの制約がなくなる","学習データが不要になる"],a:0,e:"端末側で推論するため、量子化・プルーニング等の軽量化技術と組み合わせることが多い。"},

{c:"AIの社会実装に向けて",q:"PoC（概念実証）の位置づけとして適切なものはどれか。",o:["本格開発の前に、技術的な実現可能性や効果を小規模に検証する段階","本番運用後の監視フェーズ","契約書の法的レビュー工程","データの匿名加工処理"],a:0,e:"AI開発では、アセスメント→PoC→開発→追加学習という段階を踏む探索的アプローチが一般的。"},

{c:"AIの社会実装に向けて",q:"AI開発でアジャイル的な進め方が推奨される理由として適切なものはどれか。",o:["事前に性能を確約しにくく、試行錯誤を繰り返す探索的な性質があるため","ウォーターフォールより契約が不要になるため","精度保証が法律で禁止されているため","データ量が常に一定だから"],a:0,e:"だからこそ契約でも、PoCは準委任契約とするなど段階に応じた形態が推奨される。"},
{c:"AIの社会実装に向けて",q:"データリーケージの説明として正しいものはどれか。",o:["本来使えない将来情報や目的変数の情報が学習データに混入し、評価が過大になる","個人情報が外部に漏洩すること","学習中にメモリが漏れること","モデルが盗まれること"],a:0,e:"モデルが盗まれるのはモデル窃取。データリーケージは検証設計の不備で起こりやすい。"},

{c:"AIの社会実装に向けて",q:"Docker等のコンテナ技術がAI開発で用いられる理由として適切なものはどれか。",o:["ライブラリ構成を含む実行環境を再現可能な形で配布できる","学習精度が自動的に向上する","GPUが不要になる","データの匿名化ができる"],a:0,e:"再現性の確保はAIガバナンスにおけるトレーサビリティの観点からも重要。"},
{c:"AIの社会実装に向けて",q:"BPRの説明として適切なものはどれか。",o:["業務プロセスそのものを抜本的に再設計すること","バックアップを定期取得すること","モデルを再学習すること","データを暗号化すること"],a:0,e:"AI導入時は既存業務にそのまま載せるのではなく、業務設計の見直しが効果を左右する。"},

/* --- 8. 数理・統計 --- */
{c:"数理・統計",q:"分散の説明として正しいものはどれか。",o:["データが平均からどれだけ散らばっているかを表す指標","データの中心を表す指標","2変数の直線的関係の強さ","最も頻度の高い値"],a:0,e:"標準偏差は分散の平方根。2変数の関係は共分散・相関係数、最頻値は最も多く現れる値。"},
{c:"数理・統計",q:"相関係数について正しい記述はどれか。",o:["-1から1の範囲を取り、因果関係を示すものではない","0から1の範囲を取り因果関係を示す","値が大きいほど因果が強い","単位に依存する"],a:0,e:"相関≠因果。第三の変数による疑似相関に注意が必要。偏相関係数は他変数の影響を除いた相関。"},
{c:"数理・統計",q:"中央値が平均値より適している場面として適切なものはどれか。",o:["極端な外れ値が含まれる分布の代表値を示したいとき","データが完全に正規分布のとき","全データが同じ値のとき","データ件数が2件のとき"],a:0,e:"平均は外れ値の影響を受けやすいため、年収分布などでは中央値が用いられる。"},
{c:"数理・統計",q:"条件付き確率 P(A|B) の意味として正しいものはどれか。",o:["Bが起きたという条件のもとでAが起きる確率","AとBが同時に起きる確率","AまたはBが起きる確率","Aが起きない確率"],a:0,e:"同時確率はP(A∩B)。ベイズの定理はこれらの関係を結ぶ。"},
{c:"数理・統計",q:"帰無仮説の説明として正しいものはどれか。",o:["「差がない」等の否定したい仮説で、棄却されれば対立仮説が支持される","必ず採択される仮説","有意水準そのもの","標本平均の別名"],a:0,e:"棄却できない場合も「差がないことの証明」にはならない点に注意。"},
{c:"数理・統計",q:"コサイン類似度の説明として正しいものはどれか。",o:["2つのベクトルのなす角に基づく類似度で、大きさの影響を受けにくい","2点間の直線距離","分布間の距離","データの散らばりの指標"],a:0,e:"直線距離はユークリッド距離、分布を考慮した距離はマハラノビス距離。"},
{c:"数理・統計",q:"最小二乗法の説明として正しいものはどれか。",o:["残差の二乗和を最小にするようにパラメータを推定する","尤度を最大にするようにパラメータを推定する","誤差の絶対値の最大値を最小化する","分散を最大化する"],a:0,e:"尤度最大化は最尤法。線形回帰では両者が一致する条件もある。"},
{c:"数理・統計",q:"正規分布の性質として正しいものはどれか。",o:["平均を中心に左右対称の釣鐘型で、平均±1標準偏差に約68%が含まれる","左右非対称で右に裾が長い","0か1の値のみを取る","離散的な回数の分布を表す"],a:0,e:"0/1はベルヌーイ分布、回数はポアソン分布や二項分布。"},
{c:"数理・統計",q:"疑似相関の例として最も適切なものはどれか。",o:["アイスの売上と水難事故件数が、気温という共通要因で相関して見える","身長と体重に正の相関がある","勉強時間とテスト点数に相関がある","価格と需要に負の相関がある"],a:0,e:"共通要因（交絡因子）により、直接の因果がなくても相関が観測される。"},
{c:"数理・統計",q:"期待値の説明として正しいものはどれか。",o:["確率変数が取りうる値を、その確率で重み付けて平均した値","最も起こりやすい値","中央に位置する値","最大値と最小値の平均"],a:0,e:"最も起こりやすい値は最頻値、中央に位置する値は中央値。"},

/* ========== 定数・ユーティリティ ========== */
const APP_VER = "v1.2";
const LS = {set:'gken_settings_v1', hist:'gken_hist_v1', wrong:'gken_wrong_v1', bm:'gken_bm_v1', sess:'gken_sess_v1', userq:'gken_userq_v1', daily:'gken_daily_v1'};
const SRCLBL = {original:'内蔵オリジナル', user:'自作追加', past:'過去問・外部'};
let CATS = [];
const PASS_RATE = 70; // 合否目安（公式の合格基準は非公開のため学習用の目安値）
const SEC_PER_Q = 41; // 145問100分からの概算（100*60/145≒41秒）

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){alert('保存に失敗しました（ブラウザのストレージ制限の可能性）');}};
const fmt=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?String(h)+':':'')+`${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;};
const today=()=>new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

let settings = load(LS.set,{shuffleOpt:true,hideTimer:false,daily:30});
if(settings.daily===undefined) settings.daily=30;
if(settings.hideTimer===undefined) settings.hideTimer=false;
let hist  = load(LS.hist,[]);
let wrong = load(LS.wrong,{});   // {id:{w:誤答回数, s:連続正解, d:最終日}}
let bm    = load(LS.bm,[]);      // ブックマークid配列
let S     = load(LS.sess,null);  // 進行中セッション
let userQ = load(LS.userq,[]);   // 追加問題（自作・過去問）
let daily = load(LS.daily,{});   // {'2026-09-17': 解答数}
let view  = 'home', tick=null;

/* ===== 問題バンク（内蔵＋追加）===== */
let BANK=[], QMAP={};
function rebuildBank(){
  BANK = QUESTIONS.map((q,i)=>({id:'b'+i, c:q.c, q:q.q, o:q.o, a:q.a, e:q.e, src:'original', yr:'', tag:''}))
    .concat(userQ.map(u=>({id:u.uid, c:u.c, q:u.q, o:u.o, a:u.a, e:u.e||'', src:u.src||'user', yr:u.yr||'', tag:u.tag||''})));
  QMAP={}; BANK.forEach(q=>QMAP[q.id]=q);
  CATS=[...new Set(BANK.map(q=>q.c))];
}
const Q   = id => QMAP[id];
const cntCat = c => BANK.filter(q=>q.c===c).length;
const cntSrc = s => BANK.filter(q=>(q.src||'original')===s).length;
const pastYears = () => [...new Set(BANK.filter(q=>q.src==='past'&&q.yr).map(q=>q.yr))].sort();
/* 旧版(v1.0)の数値IDを 'bN' 形式へ移行 */
function migrateIds(){
  let ch=false, w2={};
  Object.keys(wrong).forEach(k=>{const nk=/^\d+$/.test(k)?'b'+k:k; w2[nk]=wrong[k]; if(nk!==k)ch=true;});
  if(ch){wrong=w2;save(LS.wrong,wrong);}
  const b2=bm.map(x=>typeof x==='number'?'b'+x:String(x));
  if(JSON.stringify(b2)!==JSON.stringify(bm)){bm=b2;save(LS.bm,bm);}
  if(S&&Array.isArray(S.ids)&&S.ids.length&&typeof S.ids[0]==='number'){S=null;localStorage.removeItem(LS.sess);}
}
rebuildBank(); migrateIds();

/* ===== v1.2：問題数ベースの学習量管理 ===== */
const dayKey = d => { d=d||new Date(); const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
const todayCount = () => daily[dayKey()]||0;
function bumpDaily(n){ const k=dayKey(); daily[k]=(daily[k]||0)+(n||1); save(LS.daily,daily); }
function dailyGoal(){ return Math.max(0, Number(settings.daily)||0); }
function dailyLeft(){ const g=dailyGoal(); return g?Math.max(0,g-todayCount()):0; }
/* 連続学習日数（今日 or 昨日を起点に遡って計算） */
function streakDays(){
  const has=k=>(daily[k]||0)>0;
  let d=new Date();
  if(!has(dayKey(d))){ d.setDate(d.getDate()-1); if(!has(dayKey(d))) return 0; }
  let n=0;
  while(has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function lastDays(n){
  const out=[]; const d=new Date();
  for(let i=n-1;i>=0;i--){ const t=new Date(d); t.setDate(d.getDate()-i);
    out.push({k:dayKey(t), lb:(t.getMonth()+1)+'/'+t.getDate(), v:daily[dayKey(t)]||0}); }
  return out;
}

/* ========== ナビ ========== */
const NAV=[['home','ホーム'],['start','学習を始める'],['wrong','間違いノート'],['stats','学習記録'],['bank','問題の追加・管理'],['data','データ管理'],['help','使い方']];
function renderNav(){
  $('#nav').innerHTML = NAV.map(([k,l])=>`<button data-v="${k}" class="${view===k?'on':''}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(S && !S.finished && view==='exam'){ if(!confirm('試験を中断してホームに戻ります。進捗は保存され、後から再開できます。よろしいですか？')) return; persist(); }
    go(b.dataset.v);
  });
  $('#hdInfo').textContent = `全${BANK.length}問（内蔵${cntSrc('original')}／追加${cntSrc('user')+cntSrc('past')}） / ${CATS.length}分野 ・ ${APP_VER}`;
}
function go(v){ view=v; window.scrollTo(0,0); render(); }

/* ========== 画面描画 ========== */
function render(){
  renderNav();
  const a=$('#app');
  if(view==='home') a.innerHTML=viewHome();
  else if(view==='start') a.innerHTML=viewStart();
  else if(view==='exam') a.innerHTML=viewExam();
  else if(view==='result') a.innerHTML=viewResult();
  else if(view==='wrong') a.innerHTML=viewWrong();
  else if(view==='stats') a.innerHTML=viewStats();
  else if(view==='bank') a.innerHTML=viewBank();
  else if(view==='data') a.innerHTML=viewData();
  else if(view==='help') a.innerHTML=viewHelp();
  bindAll();
  setupTimer();
}

/* ---------- 出題 ---------- */
function pickPool(mode,cat,wrongFirst,src,yr){
  let pool=[];
  if(mode==='cat') pool=BANK.filter(q=>q.c===cat).map(q=>q.id);
  else if(mode==='wrong') pool=Object.keys(wrong).filter(i=>Q(i));
  else if(mode==='bm') pool=bm.filter(i=>Q(i));
  else pool=BANK.map(q=>q.id);
  if(src && src!=='all') pool=pool.filter(i=>(Q(i).src||'original')===src);
  if(yr) pool=pool.filter(i=>Q(i).yr===yr);
  pool=shuffle(pool);
  if(wrongFirst && mode!=='wrong'){
    const w=Object.keys(wrong);
    pool.sort((a,b)=>(w.includes(b)?1:0)-(w.includes(a)?1:0));
  }
  return pool;
}
function ensureOrder(id){
  if(!S.order[id]){ const n=Q(id).o.map((_,k)=>k); S.order[id]=S.shuf?shuffle(n):n; }
}
function beginSession(o){
  const pool=pickPool(o.mode,o.cat,o.wrongFirst,o.src,o.yr);
  if(!pool.length){alert('出題できる問題がありません。モード・分野・出題ソースの組み合わせを見直してください。');return;}
  const num=Number(o.num)||0;
  const ids = num>0 ? pool.slice(0,num) : pool.slice();
  const limit = o.time==='auto' ? ids.length*SEC_PER_Q : Number(o.time)||0;
  S={ title:o.title, mode:o.mode, src:o.src||'all', yr:o.yr||'', cat:o.cat||'', wf:!!o.wrongFirst,
      pool, ids, order:{}, answers:{}, flags:[], shown:{},
      cur:0, elapsed:0, limit, imm:!!o.imm, shuf:!!o.shuf,
      goal: num>0?num:0, refill:!!o.refill, autoEnd:o.autoEnd!==false, hideTimer:!!o.hideTimer,
      finished:false, started:today() };
  ids.forEach(id=>ensureOrder(id));
  persist(); go('exam');
}
function persist(){ if(S) save(LS.sess,S); }
/* 未出題から補充（エンドレス） */
function refillIds(n){
  if(!S||!S.refill) return 0;
  let rest=(S.pool||[]).filter(id=>!S.ids.includes(id)&&Q(id));
  if(!rest.length){ // プールを使い切ったら全体から再構成（重複を許して継続）
    rest=shuffle(pickPool(S.mode,S.cat,S.wf,S.src,S.yr).filter(id=>!S.ids.includes(id)));
  }
  if(!rest.length) return 0;
  const add=rest.slice(0,n||10);
  add.forEach(id=>{S.ids.push(id);ensureOrder(id);});
  persist(); return add.length;
}

/* ---------- 結果 ---------- */
function gradeSession(){
  const rows=S.ids.map(id=>{
    const q=Q(id), a=S.answers[id];
    return {id,q,a,ok:a===q.a,skip:a===undefined};
  });
  const ok=rows.filter(r=>r.ok).length, n=rows.length, rate=Math.round(ok/n*100);
  const byCat={}, bySrc={};
  rows.forEach(r=>{ byCat[r.q.c]=byCat[r.q.c]||{n:0,ok:0}; byCat[r.q.c].n++; if(r.ok)byCat[r.q.c].ok++;
    const sc=r.q.src||'original'; bySrc[sc]=bySrc[sc]||{n:0,ok:0}; bySrc[sc].n++; if(r.ok)bySrc[sc].ok++; });
  return {rows,ok,n,rate,byCat,bySrc};
}
function finishSession(){
  const g=gradeSession();
  g.rows.forEach(r=>{
    if(r.skip) return;
    if(r.ok){
      if(wrong[r.id]){ wrong[r.id].s=(wrong[r.id].s||0)+1; wrong[r.id].d=today();
        if(wrong[r.id].s>=2) delete wrong[r.id]; }
    }else{
      wrong[r.id]=wrong[r.id]||{w:0,s:0};
      wrong[r.id].w++; wrong[r.id].s=0; wrong[r.id].d=today();
    }
  });
  save(LS.wrong,wrong);
  hist.push({date:today(),title:S.title,ok:g.ok,n:g.n,rate:g.rate,sec:S.elapsed,unlimited:!S.limit,
             cat:Object.fromEntries(Object.entries(g.byCat).map(([k,v])=>[k,[v.ok,v.n]])),
             src:Object.fromEntries(Object.entries(g.bySrc).map(([k,v])=>[k,[v.ok,v.n]]))});
  if(hist.length>200) hist=hist.slice(-200);
  save(LS.hist,hist);
  S.finished=true; persist(); go('result');
}

        <button class="btn gray" data-bmid="${i}">${bm.includes(i)?'★ 解除':'☆ ブックマーク'}</button></div></div>
      </details>`;}).join('')}`
    :`<p>まだ登録がありません。演習を行うと自動で貯まります。</p><button class="btn" data-act="start">学習を始める</button>`}
  </div>
  ${bm.length?`<div class="card"><h2>⭐ ブックマーク（${bm.length}問）</h2>
    <div class="foot"><button class="btn g" data-quick="bm">▶ ブックマークで演習する</button></div>
    ${bm.filter(i=>Q(i)).map(i=>{const q=Q(i);return `
      <details class="rv"><summary><span class="tag">${esc(q.c)}</span><span style="flex:1">${esc(q.q)}</span></summary>
      <div class="body">${q.o.map((t,k)=>`<div style="padding:4px 8px;background:${k===q.a?'var(--green-l)':'transparent'};border-radius:6px">${k===q.a?'✔ ':'　'}${esc(t)}</div>`).join('')}
      <div class="expl"><b>解説</b>${q.e?esc(q.e):'（解説未登録）'}</div>
      <div class="foot"><button class="btn gray" data-bmid="${i}">★ ブックマーク解除</button></div></div></details>`;}).join('')}
    </div>`:''}`;
}

      <button class="btn red" data-act="clearDaily">日別の解答数をクリア</button></div>
  </div>`;
}

/* ========== イベント ========== */
function bindAll(){
  const app=$('#app');
  app.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
  app.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>quick(b.dataset.quick));
  app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.opt)));
  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{S.cur=Number(b.dataset.jump);persist();render();});
  app.querySelectorAll('[data-bmid]').forEach(b=>b.onclick=()=>{toggleBm(b.dataset.bmid);render();});
  app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editingUid=b.dataset.edit;go('bank');});
  app.querySelectorAll('[data-rmwrong]').forEach(b=>b.onclick=()=>{delete wrong[b.dataset.rmwrong];save(LS.wrong,wrong);render();});
  const f=$('#fileIn'); if(f) f.onchange=importFile;
  bindBank(app);
}
function toggleBm(id){ id=String(id); const i=bm.indexOf(id); if(i<0)bm.push(id); else bm.splice(i,1); save(LS.bm,bm); }

function quick(k){
  const sh=settings.shuffleOpt;
  if(k==='mock') beginSession({title:'疑似試験（50問）',mode:'mock',num:50,time:'auto',imm:0,shuf:sh,autoEnd:false});
  else if(k==='endless') beginSession({title:'じっくり演習（時間無制限）',mode:'all',num:0,time:'0',imm:1,shuf:sh,hideTimer:true,autoEnd:false});
  else if(k==='count20') beginSession({title:'20問チャレンジ（無制限）',mode:'all',num:20,time:'0',imm:1,shuf:sh,hideTimer:true,autoEnd:true});
  else if(k==='daily'){
    const g=dailyGoal(), left=dailyLeft();
    if(!g){ alert('1日の目標問題数が未設定です。「学習を始める」画面の下部で設定してください。'); go('start'); return; }
    if(!left){ if(!confirm(`本日の目標（${g}問）は達成済みです。さらに${g}問ぶん続けますか？`)) return; }
    beginSession({title:'今日のノルマ',mode:'all',num:left||g,time:'0',imm:1,shuf:sh,hideTimer:true,refill:true,autoEnd:true});
  }
  else if(k==='short5') beginSession({title:'5分学習',mode:'short',num:0,time:'300',imm:1,shuf:sh,autoEnd:false});
  else if(k==='short10') beginSession({title:'10分学習',mode:'short',num:0,time:'600',imm:1,shuf:sh,autoEnd:false});
  else if(k==='wrong'){ if(!Object.keys(wrong).length){alert('間違いノートが空です。まず演習してください。');return;}
    beginSession({title:'間違い復習',mode:'wrong',num:0,time:'0',imm:1,shuf:sh,hideTimer:true,autoEnd:false}); }
  else if(k==='bm'){ if(!bm.length){alert('ブックマークがありません。');return;}
    beginSession({title:'ブックマーク演習',mode:'bm',num:0,time:'0',imm:1,shuf:sh,hideTimer:true,autoEnd:false}); }
  else if(k==='past'){ if(!cntSrc('past')){alert('過去問・外部問題がまだ登録されていません。「問題の追加・管理」から追加または取り込みしてください。');go('bank');return;}
    beginSession({title:'過去問演習',mode:'all',num:0,time:'0',imm:1,shuf:sh,src:'past',hideTimer:true,autoEnd:false}); }
  else if(k==='user'){ if(!cntSrc('user')){alert('自作問題がまだありません。「問題の追加・管理」から追加してください。');go('bank');return;}
    beginSession({title:'自作問題演習',mode:'all',num:0,time:'0',imm:1,shuf:sh,src:'user',hideTimer:true,autoEnd:false}); }
  else if(k==='bank') go('bank');
  else if(k==='cat') go('start');
}

function act(a){
  if(a==='home') go('home');
  else if(a==='start') go('start');
  else if(a==='bank') go('bank');
  else if(a==='resume') go('exam');
  else if(a==='discard'){ if(confirm('中断中のセッションを破棄します。よろしいですか？')){S=null;localStorage.removeItem(LS.sess);render();} }
  else if(a==='saveDaily'){
    settings.daily=Math.max(0,Number($('#mDaily').value)||0); save(LS.set,settings);
    alert(`1日の目標問題数を ${settings.daily} 問に設定しました。`); render();
  }
  else if(a==='begin'){
    const mode=$('#mMode').value, cat=$('#mCat').value, num=Number($('#mNum').value),
          time=$('#mTime').value, imm=$('#mImm').value==='1', shuf=$('#mShuf').checked, wf=$('#mWrongFirst').checked,
          src=$('#mSrc').value, yr=$('#mYr').value, refill=$('#mRefill').checked,
          autoEnd=$('#mAutoEnd').checked, hideTimer=$('#mHideTimer').checked;
    settings.shuffleOpt=shuf; settings.hideTimer=hideTimer;
    settings.daily=Math.max(0,Number($('#mDaily').value)||0); save(LS.set,settings);
    const names={mock:'疑似試験',short:'短時間学習',cat:'分野別演習：'+cat,wrong:'間違い復習',bm:'ブックマーク演習',all:'全問チャレンジ'};
    const sfx=(src&&src!=='all'?'／'+SRCLBL[src]:'')+(yr?'（'+yr+'）':'')+(Number(time)===0&&time!=='auto'?'／無制限':'');
    beginSession({title:names[mode]+sfx,mode,cat,num,time,imm,shuf,wrongFirst:wf,src,yr,refill,autoEnd,hideTimer});
  }
  else if(a==='prev'){ S.cur=Math.max(0,S.cur-1); persist(); render(); }
  else if(a==='next'){
    if(S.cur>=S.ids.length-1 && S.refill){ const n=refillIds(10); if(!n){alert('これ以上追加できる問題がありません。');return;} }
    S.cur=Math.min(S.ids.length-1,S.cur+1); persist(); render();
  }
  else if(a==='add10'){ const n=refillIds(10); alert(n?`${n}問を追加しました。`:'追加できる問題がありません。'); render(); }
  else if(a==='flag'){ const id=S.ids[S.cur],i=S.flags.indexOf(id); if(i<0)S.flags.push(id);else S.flags.splice(i,1); persist(); render(); }
  else if(a==='bm'){ toggleBm(S.ids[S.cur]); render(); }
  else if(a==='check'||a==='peek'){ S.shown[S.ids[S.cur]]=true; persist(); render(); }
  else if(a==='pause'){ persist(); alert('進捗を保存しました。ホーム画面から再開できます。'); go('home'); }
  else if(a==='finish'){
    const un=S.ids.length-Object.keys(S.answers).length;
    if(un>0 && !confirm(`未解答が${un}問あります。このまま採点しますか？`)) return;
    finishSession();
  }
  else if(a==='again'){ const t=S.title,m=S.mode,n=S.goal||S.ids.length,l=S.limit,im=S.imm,sh=S.shuf,sc=S.src,yy=S.yr,
      ct=S.cat||Q(S.ids[0]).c, rf=S.refill, ae=S.autoEnd, ht=S.hideTimer;
    beginSession({title:t,mode:m,cat:ct,num:n,time:String(l),imm:im,shuf:sh,src:sc,yr:yy,refill:rf,autoEnd:ae,hideTimer:ht}); }
  else if(a==='retryWrong'){
    const ids=gradeSession().rows.filter(r=>!r.ok).map(r=>r.id);
    const sh=S.shuf;
    S={title:'誤答の再挑戦',mode:'retry',src:'all',yr:'',cat:'',wf:false,pool:ids.slice(),ids:shuffle(ids),
       order:{},answers:{},flags:[],shown:{},cur:0,elapsed:0,limit:0,imm:true,shuf:sh,
       goal:0,refill:false,autoEnd:false,hideTimer:true,finished:false,started:today()};
    S.ids.forEach(id=>ensureOrder(id));
    persist(); go('exam');
  }
  else if(a==='print') window.print();
  else if(a==='clearWrong'){ if(confirm('間違いノートを全件削除します。よろしいですか？')){wrong={};save(LS.wrong,wrong);render();} }
  else if(a==='clearHist'){ if(confirm('学習履歴を全件削除します。よろしいですか？')){hist=[];save(LS.hist,hist);render();} }
  else if(a==='clearDaily'){ if(confirm('日別の解答数（連続学習日数の元データ）を削除します。よろしいですか？')){daily={};save(LS.daily,daily);render();} }
  else if(a==='export') exportData();
  else if(a==='import') $('#fileIn').click();
  else if(a==='reset'){ if(confirm('すべての学習データ（履歴・間違いノート・ブックマーク・追加問題・日別解答数・中断セッション）を削除します。元に戻せません。よろしいですか？')){
    Object.values(LS).forEach(k=>localStorage.removeItem(k)); hist=[];wrong={};bm=[];S=null;userQ=[];daily={};settings={shuffleOpt:true,hideTimer:false,daily:30};rebuildBank(); go('home'); } }
}

function choose(oi){
  const id=S.ids[S.cur];
  if(S.shown[id]) return;
  const first = S.answers[id]===undefined;
  S.answers[id]=oi;
  if(first) bumpDaily(1);
  if(S.imm) S.shown[id]=true;
  persist();
  // 目標問題数に到達したら自動採点
  const done=Object.keys(S.answers).length;
  if(S.autoEnd && S.goal>0 && done>=S.goal){
    render();
    setTimeout(()=>{
      if(confirm(`目標の ${S.goal} 問を解答しました。採点しますか？\n（「キャンセル」で続行できます）`)) finishSession();
      else { S.autoEnd=false; persist(); render(); }
    }, S.imm?350:0);
    return;
  }
  render();
}

(function patchViewExam(){

    const id=S.ids[S.cur];
    const wasImm=S.imm;
    if(S.shown[id]) S.imm=true;      // 個別公開した問題は解説表示

/* ========== タイマー ========== */
function setupTimer(){
  if(tick){clearInterval(tick);tick=null;}
  if(view!=='exam'||!S||S.finished) return;
  S._t=Date.now();
  tick=setInterval(()=>{
    const now=Date.now(); S.elapsed+=(now-S._t)/1000; S._t=now;
    const el=$('#tmr');
    if(el){
      if(S.limit){
        const left=S.limit-S.elapsed;
        el.textContent='残り '+fmt(left);
        el.className='timer'+(left<=60?' warn':'');
        if(left<=0){ clearInterval(tick);tick=null; alert('制限時間になりました。採点します。'); finishSession(); return; }
      }else{ el.textContent=fmt(S.elapsed); }
    }
    if(Math.floor(S.elapsed)%10===0) persist();
  },1000);
}
window.addEventListener('beforeunload',()=>{persist();});

/* ========== キーボード ========== */
document.addEventListener('keydown',e=>{
  if(view!=='exam'||!S||S.finished) return;
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  const id=S.ids[S.cur], ord=S.order[id];
  if(['1','2','3','4','5','6'].includes(e.key)){ const k=Number(e.key)-1; if(ord[k]!==undefined) choose(ord[k]); }
  else if(e.key==='ArrowLeft') act('prev');
  else if(e.key==='ArrowRight'||e.key==='Enter') act('next');
  else if(e.key.toLowerCase()==='f') act('flag');
});

/* ---------- CSV ---------- */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[]; let row=[], cell='', inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; }
      else cell+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===','||ch==='\t'){ row.push(cell); cell=''; }
      else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=ch;
    }
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function importCSVText(text){
  const rows=parseCSV(text);
  if(!rows.length){alert('取り込めるデータがありません。');return;}
  let start=0;
  const h=rows[0].map(x=>String(x).trim());
  if(h[0]==='分野'||h.includes('問題文')) start=1;
  const add=[], err=[];
  for(let i=start;i<rows.length;i++){
    const r=rows[i].map(x=>String(x==null?'':x).trim());
    const c=r[0], srcRaw=r[1]||'', yr=r[2]||'', qt=r[3]||'';
    const opts=r.slice(4,10).filter(x=>x);
    const aNo=parseInt(r[10],10), e=r[11]||'', tag=r[12]||'';
    if(!c||!qt){err.push(`${i+1}行目：分野または問題文が空`);continue;}
    if(opts.length<2){err.push(`${i+1}行目：選択肢が2つ未満`);continue;}
    if(!(aNo>=1&&aNo<=opts.length)){err.push(`${i+1}行目：正解番号(${r[10]||'空'})が選択肢の範囲外`);continue;}
    const src=/過去|外部|公式|市販/.test(srcRaw)?'past':'user';
    add.push({uid:uid(),c,q:qt,o:opts,a:aNo-1,e,src,yr,tag});
  }
  if(!add.length){alert('取り込めた問題がありません。\n\n'+err.slice(0,10).join('\n'));return;}
  if(!confirm(`${add.length}問を取り込みます。${err.length?`\n（${err.length}行はスキップされます）`:''}\nよろしいですか？`)) return;
  userQ=userQ.concat(add); save(LS.userq,userQ); rebuildBank();
  alert(`${add.length}問を取り込みました。`+(err.length?`\n\n■ スキップした行（先頭10件）\n`+err.slice(0,10).join('\n'):''));
  render();
}
function importJSONQuestions(text){
  let d; try{ d=JSON.parse(text); }catch(e){ alert('JSONの読み込みに失敗しました：'+e.message); return; }
  const arr = Array.isArray(d) ? d : (d.questions||d.userQ||null);
  if(!Array.isArray(arr)){ alert('問題の配列が見つかりません。[{c,q,o,a,e,src,yr,tag}] 形式にしてください。'); return; }
  const add=[],err=[];
  arr.forEach((x,i)=>{
    if(!x||!x.c||!x.q||!Array.isArray(x.o)||x.o.length<2||!(x.a>=0&&x.a<x.o.length)){err.push(i+1);return;}
    add.push({uid:uid(),c:String(x.c),q:String(x.q),o:x.o.map(String),a:Number(x.a),
      e:String(x.e||''),src:x.src==='past'?'past':'user',yr:String(x.yr||''),tag:String(x.tag||'')});
  });
  if(!add.length){alert('取り込める問題がありませんでした。');return;}
  if(!confirm(`${add.length}問を取り込みます。${err.length?`（${err.length}件は形式不正でスキップ）`:''}`)) return;
  userQ=userQ.concat(add); save(LS.userq,userQ); rebuildBank();
  alert(`${add.length}問を取り込みました。`); render();
}
function dlText(name, text, mime){
  const blob=new Blob(['\uFEFF'+text],{type:mime||'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
const csvCell = v => { v=String(v==null?'':v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
const CSVHEAD = ['分野','出典','年度','問題文','選択肢1','選択肢2','選択肢3','選択肢4','選択肢5','選択肢6','正解番号','解説','タグ'];
function csvTemplate(){
  const rows=[CSVHEAD,
    ['機械学習の概要','自作','','ホールドアウト検証の説明として正しいものはどれか。','データを学習用と検証用に分けて評価する','全データで学習し全データで評価する','データをk個に分割して繰り返す','学習率を段階的に下げる','','',1,'k分割交差検証との違いを押さえること。','要暗記'],
    ['法律と契約','過去問','2025#2','（ここに問題文を記載）','選択肢1','選択肢2','選択肢3','選択肢4','','',2,'（解説が手元にない場合は空欄で可）','']];
  dlText('Gken_問題テンプレート.csv', rows.map(r=>r.map(csvCell).join(',')).join('\r\n'));
}
function csvExportAll(){
  const rows=[CSVHEAD].concat(BANK.map(q=>{
    const o=[...q.o]; while(o.length<6) o.push('');
    return [q.c, SRCLBL[q.src]||q.src, q.yr||'', q.q, ...o.slice(0,6), q.a+1, q.e||'', q.tag||''];
  }));
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  dlText(`Gken_問題一覧_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.csv`,
    rows.map(r=>r.map(csvCell).join(',')).join('\r\n'));
}

/* ---------- イベント ---------- */
function bindBank(app){
  app.querySelectorAll('[data-bk]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.bk, id=b.dataset.id;
    if(k==='save') saveQuestion();
    else if(k==='cancel'){ editingUid=null; formDraft=null; render(); }
    else if(k==='clear'){ formDraft=null; render(); }
    else if(k==='del') deleteQuestion(editingUid);
    else if(k==='delid') deleteQuestion(id);
    else if(k==='edit'){ editingUid=id; formDraft=null; render();
      const f=$('#bkForm'); if(f) f.scrollIntoView({behavior:'smooth',block:'start'}); }
    else if(k==='csvIn'){ const t=$('#bkCsv').value.trim(); if(!t){alert('CSVを貼り付けてください。');return;} importCSVText(t); }
    else if(k==='pickFile') $('#bkFile').click();
    else if(k==='tpl') csvTemplate();
    else if(k==='csvOut') csvExportAll();
    else if(k==='quizPast') quick('past');
    else if(k==='quizUser') quick('user');
  });
  const cs=app.querySelector('#bkCat');
  if(cs) cs.onchange=()=>{ const n=$('#bkCatNew'); if(!n)return;
    if(cs.value==='__new'){ n.classList.remove('hide'); n.focus(); } else n.classList.add('hide'); };
  const ff=app.querySelector('#bkFile');
  if(ff) ff.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ const t=String(r.result);
      if(/\.json$/i.test(f.name)) importJSONQuestions(t); else importCSVText(t); e.target.value=''; };
    r.readAsText(f,'UTF-8');
  };
  const fs=app.querySelector('#bkFsrc'), fc=app.querySelector('#bkFcat'), fk=app.querySelector('#bkFkw');
  if(fs) fs.onchange=()=>{ formDraft=readForm(); bankF.src=fs.value; render(); };
  if(fc) fc.onchange=()=>{ formDraft=readForm(); bankF.cat=fc.value; render(); };
  if(fk){ fk.onkeydown=ev=>{ if(ev.key==='Enter'){ formDraft=readForm(); bankF.kw=fk.value.trim(); render(); } };
          fk.onblur=()=>{ if(fk.value.trim()!==bankF.kw){ formDraft=readForm(); bankF.kw=fk.value.trim(); render(); } }; }
}

/* ========== 起動 ========== */
if(S && S.finished) { S=null; localStorage.removeItem(LS.sess); }
if(S && !S.pool) S.pool = (S.ids||[]).slice();   // v1.1 セッションの互換維持
render();
</script>
